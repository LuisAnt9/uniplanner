<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>UniPlanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --bg2: #161b27;
      --bg3: #1e2538;
      --bg4: #252d42;
      --border: #ffffff14;
      --text: #e8edf5;
      --muted: #7b8ab0;
      --accent: #4a7cf7;
      --accent2: #6b9bff;
      --green: #3ecf8e;
      --red: #f66;
      --yellow: #f5c542;
      --pink: #e879a0;
      --purple: #a78bfa;
      --radius: 16px;
      --nav-h: 68px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #0a0d14;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* SCREENS */
    .screen {
      position: absolute;
      top: 0; left: 0; right: 0;
      bottom: var(--nav-h);
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 24px;
      display: none;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: none; }
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 52px 20px 12px;
    }

    .topbar-logo {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .topbar-logo span { color: var(--accent2); }

    .topbar-icons { display: flex; gap: 8px; }

    .topbar-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      cursor: pointer;
    }

    .screen-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 52px 20px 20px;
    }

    .back-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--bg3);
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }

    .screen-title {
      font-size: 20px;
      font-weight: 800;
      flex: 1;
    }

    .header-action {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--bg3);
      border: none;
      color: var(--muted);
      font-size: 17px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* HOME */
    .greeting { padding: 4px 20px 24px; }
    .greeting-name { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .greeting-date { font-size: 14px; color: var(--muted); font-weight: 600; }

    .home-cards { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }

    .home-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .home-card:hover { border-color: #ffffff22; }

    .home-card-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .home-card-info { flex: 1; }
    .home-card-label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
    .home-card-value { font-size: 15px; font-weight: 700; color: #fff; }

    .divider { height: 1px; background: var(--border); margin: 0 20px; }

    .btn-add-task {
      margin: 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-add-task:hover { background: #3b6de8; }

    /* TABS */
    .tabs {
      display: flex;
      margin: 0 20px 16px;
      background: var(--bg3);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 9px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s;
      border: none;
      background: none;
      font-family: 'Nunito', sans-serif;
    }

    .tab.active { background: var(--accent); color: #fff; }

    /* QUICK ADD */
    .quick-add {
      display: flex;
      gap: 8px;
      margin: 0 20px 16px;
    }

    .quick-add input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      outline: none;
    }

    .quick-add input::placeholder { color: var(--muted); }
    .quick-add input:focus { border-color: var(--accent); }

    .quick-add button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    /* TASK ITEM */
    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    .task-checkbox {
      width: 24px; height: 24px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 800;
      color: transparent;
      background: #4a7cf712;
      transition: all 0.15s;
    }

    .task-checkbox.checked { background: var(--green); border-color: var(--green); color: #fff; }

    .task-text { flex: 1; font-size: 15px; font-weight: 600; }
    .task-text.done { text-decoration: line-through; color: var(--muted); }

    .task-del {
      background: none; border: none;
      color: var(--muted); font-size: 16px;
      cursor: pointer; padding: 4px;
      opacity: 0.5; transition: opacity 0.15s;
    }
    .task-del:hover { opacity: 1; color: var(--red); }

    /* SUBJECTS */
    .add-subject-btn {
      margin: 0 20px 14px;
      background: #1e3a8a22;
      border: 1px dashed #4a7cf755;
      border-radius: var(--radius);
      padding: 14px;
      color: var(--accent2);
      font-size: 14px;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    .subject-card {
      margin: 0 20px 10px;
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex; align-items: center; gap: 12px;
      animation: fadeUp 0.2s ease;
    }

    .subject-dot {
      width: 14px; height: 14px;
      border-radius: 4px; flex-shrink: 0;
    }

    .subject-info { flex: 1; }
    .subject-name { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 3px; }
    .subject-meta { font-size: 13px; color: rgba(255,255,255,0.65); }

    .subject-del {
      background: none; border: none;
      color: rgba(255,255,255,0.4); font-size: 16px; cursor: pointer; padding: 4px;
    }

    /* CALENDAR */
    .calendar-wrap { padding: 0 20px; }

    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }

    .cal-nav-btn {
      background: var(--bg3); border: none; color: var(--text);
      width: 36px; height: 36px; border-radius: 10px;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .cal-month { font-size: 17px; font-weight: 800; }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px; text-align: center;
    }

    .cal-dow { font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 0; }

    .cal-day {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
      border-radius: 50%; cursor: pointer;
      transition: background 0.1s;
      position: relative;
    }

    .cal-day:hover:not(.today) { background: var(--bg3); }
    .cal-day.other-month { color: var(--muted); opacity: 0.35; }
    .cal-day.today { background: var(--accent); color: #fff; }
    .cal-day.sel:not(.today) { background: #4a7cf730; color: var(--accent2); outline: 2px solid var(--accent); }
    .cal-day.has-event::after {
      content: ''; position: absolute; bottom: 3px;
      width: 4px; height: 4px; border-radius: 50%; background: var(--green);
    }

    .events-section { margin-top: 24px; }
    .events-label { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: var(--text); }

    .event-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
      animation: fadeUp 0.2s ease;
    }

    .event-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }

    .event-info { flex: 1; }
    .event-name { font-size: 15px; font-weight: 700; }
    .event-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .event-hour { font-size: 14px; font-weight: 700; color: var(--muted); }
    .event-del { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; }

    /* PROFILE */
    .profile-wrap { padding: 0 20px; display: flex; flex-direction: column; align-items: center; }

    .avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--bg3); border: 3px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin-bottom: 14px; overflow: hidden;
    }

    .profile-name { font-size: 22px; font-weight: 800; margin-bottom: 20px; }

    .profile-info {
      width: 100%; background: var(--bg2);
      border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 16px;
    }

    .profile-row {
      display: flex; align-items: center;
      padding: 15px 18px; border-bottom: 1px solid var(--border);
    }

    .profile-row:last-child { border-bottom: none; }
    .profile-row-label { font-size: 14px; color: var(--muted); font-weight: 600; flex: 1; }
    .profile-row-value { font-size: 14px; font-weight: 700; }

    .toggle {
      width: 46px; height: 26px; border-radius: 13px;
      background: var(--accent); position: relative; cursor: pointer; transition: background 0.2s;
    }

    .toggle::after {
      content: ''; position: absolute;
      top: 3px; right: 3px; width: 20px; height: 20px;
      border-radius: 50%; background: #fff; transition: all 0.2s;
    }

    .toggle.off { background: var(--bg4); }
    .toggle.off::after { right: auto; left: 3px; }

    .btn-outline {
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent2); border-radius: 12px;
      padding: 12px 24px; font-size: 14px; font-weight: 700;
      font-family: 'Nunito', sans-serif; cursor: pointer; width: 100%;
      transition: background 0.15s; margin-bottom: 10px;
    }

    .btn-outline:hover { background: #4a7cf718; }
    .btn-outline.danger { border-color: var(--red); color: var(--red); }
    .btn-outline.danger:hover { background: #f6666618; }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: var(--nav-h);
      background: var(--bg2); border-top: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-around;
      padding-top: 10px; z-index: 100;
    }

    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; padding: 4px 14px; border-radius: 12px;
      border: none; background: none; color: var(--muted);
      font-family: 'Nunito', sans-serif; transition: color 0.15s;
    }

    .nav-btn .nav-icon { font-size: 22px; line-height: 1; }
    .nav-btn .nav-label { font-size: 11px; font-weight: 700; }
    .nav-btn.active { color: var(--accent); }

    /* MODAL — bottom sheet */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: #00000088; backdrop-filter: blur(6px);
      z-index: 200; align-items: flex-end; justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 24px 24px 0 0; padding: 20px 20px 40px;
      width: 100%; max-width: 430px;
      animation: sheetUp 0.25s ease;
    }

    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }

    .modal-handle {
      width: 40px; height: 4px; background: var(--bg4);
      border-radius: 2px; margin: 0 auto 20px;
    }

    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 18px; }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; }

    .form-input {
      width: 100%; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; font-size: 14px;
      font-family: 'Nunito', sans-serif; color: var(--text); outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus { border-color: var(--accent); }
    select.form-input option { background: var(--bg3); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }

    .btn-cancel {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700;
      font-family: 'Nunito', sans-serif; color: var(--muted); cursor: pointer;
    }

    .btn-save {
      flex: 2; background: var(--accent); border: none;
      border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700;
      font-family: 'Nunito', sans-serif; color: #fff; cursor: pointer;
    }

    .btn-save:hover { background: #3b6de8; }

    /* COLOR PICKER */
    .color-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .color-opt {
      width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; border: 3px solid transparent; transition: transform 0.1s;
    }

    .color-opt.sel { border-color: #fff; transform: scale(1.2); }

    /* EMPTY */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.35; }

    /* TOAST */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 14px); left: 50%;
      transform: translateX(-50%); background: var(--bg3);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 22px; font-size: 14px; font-weight: 600;
      z-index: 9999; white-space: nowrap;
      animation: toastPop 0.2s ease;
    }

    @keyframes toastPop {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to { opacity: 1; transform: translateX(-50%); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ══════════ HOME ══════════ -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <div class="topbar-logo">Uni<span>-Planner</span></div>
      <div class="topbar-icons">
        <div class="topbar-icon">🔔</div>
        <div class="topbar-icon">☰</div>
      </div>
    </div>
    <div class="greeting">
      <div class="greeting-name" id="home-greeting">Olá! 👋</div>
      <div class="greeting-date" id="home-date"></div>
    </div>
    <div class="home-cards">
      <div class="home-card" onclick="goTo('subjects')">
        <div class="home-card-icon" style="background:#162d6e">📘</div>
        <div class="home-card-info">
          <div class="home-card-label">Próxima Aula</div>
          <div class="home-card-value" id="home-next-class">Nenhuma aula hoje</div>
        </div>
      </div>
      <div class="home-card" onclick="goTo('tasks')">
        <div class="home-card-icon" style="background:#3d1060">🎯</div>
        <div class="home-card-info">
          <div class="home-card-label">Tarefas Pendentes</div>
          <div class="home-card-value" id="home-pending-count">0 tarefas para hoje</div>
        </div>
      </div>
    </div>
    <button class="btn-add-task" onclick="openTaskModal()">＋ Adicionar Tarefa</button>
  </div>

  <!-- ══════════ TAREFAS ══════════ -->
  <div class="screen" id="screen-tasks">
    <div class="screen-header">
      <button class="back-btn" onclick="goTo('home')">‹</button>
      <div class="screen-title">📋 Tarefas</div>
      <button class="header-action" onclick="openTaskModal()" title="Nova tarefa">⋯</button>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-pending" onclick="switchTab('pending')">Pendentes</button>
      <button class="tab" id="tab-done" onclick="switchTab('done')">Concluídas</button>
    </div>
    <div class="quick-add">
      <input id="quick-input" class="form-input" placeholder="Adicionar nova tarefa..." />
      <button onclick="quickAdd()">Adicionar</button>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- ══════════ MATÉRIAS ══════════ -->
  <div class="screen" id="screen-subjects">
    <div class="screen-header">
      <button class="back-btn" onclick="goTo('home')">‹</button>
      <div class="screen-title">📚 Matérias</div>
      <button class="header-action" onclick="openSubjectModal()">≡</button>
    </div>
    <button class="add-subject-btn" onclick="openSubjectModal()">＋ Adicionar Matéria</button>
    <div id="subject-list"></div>
  </div>

  <!-- ══════════ CALENDÁRIO ══════════ -->
  <div class="screen" id="screen-calendar">
    <div class="screen-header">
      <button class="back-btn" onclick="goTo('home')">‹</button>
      <div class="screen-title">📅 Calendário</div>
      <button class="header-action" onclick="openEventModal()">🗓</button>
    </div>
    <div class="calendar-wrap">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="cal-month" id="cal-month-label"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="events-section">
        <div class="events-label" id="events-label">Eventos do Dia</div>
        <div id="events-day-list"></div>
      </div>
    </div>
  </div>

  <!-- ══════════ PERFIL ══════════ -->
  <div class="screen" id="screen-profile">
    <div class="screen-header">
      <button class="back-btn" onclick="goTo('home')">‹</button>
      <div class="screen-title">👤 Perfil</div>
    </div>
    <div class="profile-wrap">
      <div class="avatar">👩‍🎓</div>
      <div class="profile-name" id="profile-name-display">Estudante</div>
      <div class="profile-info">
        <div class="profile-row">
          <span class="profile-row-label">Curso</span>
          <span class="profile-row-value" id="profile-curso-display">—</span>
        </div>
        <div class="profile-row">
          <span class="profile-row-label">Período</span>
          <span class="profile-row-value" id="profile-periodo-display">—</span>
        </div>
        <div class="profile-row">
          <span class="profile-row-label">Tema</span>
          <span class="profile-row-value">Escuro</span>
          <div class="toggle" id="theme-toggle" onclick="this.classList.toggle('off')"></div>
        </div>
      </div>
      <button class="btn-outline" onclick="openProfileModal()">✏️ Editar Perfil</button>
      <button class="btn-outline danger" onclick="resetData()">🔄 Resetar Dados</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="goTo('home')">
      <span class="nav-icon">🏠</span><span class="nav-label">Início</span>
    </button>
    <button class="nav-btn" id="nav-tasks" onclick="goTo('tasks')">
      <span class="nav-icon">➕</span><span class="nav-label">Tarefas</span>
    </button>
    <button class="nav-btn" id="nav-subjects" onclick="goTo('subjects')">
      <span class="nav-icon">🎒</span><span class="nav-label">Matérias</span>
    </button>
    <button class="nav-btn" id="nav-calendar" onclick="goTo('calendar')">
      <span class="nav-icon">📅</span><span class="nav-label">Calendário</span>
    </button>
    <button class="nav-btn" id="nav-profile" onclick="goTo('profile')">
      <span class="nav-icon">👤</span><span class="nav-label">Perfil</span>
    </button>
  </nav>

</div>

<!-- MODAL TASK -->
<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✅ Nova Tarefa</div>
    <div class="form-group">
      <label class="form-label">Título *</label>
      <input id="t-title" class="form-input" placeholder="Ex: Estudar para prova..."/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Prazo</label>
        <input id="t-due" class="form-input" type="datetime-local"/>
      </div>
      <div class="form-group">
        <label class="form-label">Matéria</label>
        <select id="t-subject" class="form-input"><option value="">Nenhuma</option></select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('task')">Cancelar</button>
      <button class="btn-save" onclick="saveTask()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL SUBJECT -->
<div class="modal-overlay" id="modal-subject">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📚 Nova Matéria</div>
    <div class="form-group">
      <label class="form-label">Nome *</label>
      <input id="s-name" class="form-input" placeholder="Ex: Cálculo II..."/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Professor</label>
        <input id="s-teacher" class="form-input" placeholder="Prof. Silva"/>
      </div>
      <div class="form-group">
        <label class="form-label">Horário</label>
        <input id="s-schedule" class="form-input" placeholder="Seg/Qua 10h"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Cor</label>
      <div class="color-row" id="color-row"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('subject')">Cancelar</button>
      <button class="btn-save" onclick="saveSubject()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL EVENT -->
<div class="modal-overlay" id="modal-event">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📅 Novo Evento</div>
    <div class="form-group">
      <label class="form-label">Título *</label>
      <input id="e-title" class="form-input" placeholder="Ex: Prova de Física..."/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Data *</label>
        <input id="e-date" class="form-input" type="date"/>
      </div>
      <div class="form-group">
        <label class="form-label">Horário</label>
        <input id="e-time" class="form-input" type="time"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Tipo</label>
      <select id="e-type" class="form-input">
        <option value="trabalho">📘 Trabalho</option>
        <option value="prova">📝 Prova</option>
        <option value="reunião">🤝 Reunião</option>
        <option value="outro">📌 Outro</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('event')">Cancelar</button>
      <button class="btn-save" onclick="saveEvent()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL PROFILE -->
<div class="modal-overlay" id="modal-profile">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ Editar Perfil</div>
    <div class="form-group">
      <label class="form-label">Nome</label>
      <input id="p-name" class="form-input" placeholder="Seu nome"/>
    </div>
    <div class="form-group">
      <label class="form-label">Curso</label>
      <input id="p-curso" class="form-input" placeholder="Ex: Engenharia de Software"/>
    </div>
    <div class="form-group">
      <label class="form-label">Período</label>
      <input id="p-periodo" class="form-input" placeholder="Ex: 5º Semestre"/>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('profile')">Cancelar</button>
      <button class="btn-save" onclick="saveProfile()">Salvar</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let tasks=[], subjects=[], events=[];
let currentTab = 'pending';
let calYear, calMonth, selDay;
let selColor = '#4a7cf7';
let profile = { name:'Estudante', curso:'', periodo:'' };
const COLORS = ['#4a7cf7','#3ecf8e','#e879a0','#a78bfa','#f5c542','#f97316','#06b6d4','#ef4444','#84cc16'];
const TYPE_ICONS = { prova:'📝', trabalho:'📘', 'reunião':'🤝', outro:'📌' };
const TYPE_BG   = { prova:'#3b1515', trabalho:'#162d6e', 'reunião':'#2d1b5a', outro:'#1e2538' };

// ─── INIT ───
async function init() {
  const p = localStorage.getItem('up_profile');
  if (p) profile = JSON.parse(p);

  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth(); selDay = now.getDate();

  try {
    const [t,s,e] = await Promise.all([
      fetch(API+'/tasks').then(r=>r.json()),
      fetch(API+'/subjects').then(r=>r.json()),
      fetch(API+'/events').then(r=>r.json()),
    ]);
    tasks    = t.data || [];
    subjects = s.data || [];
    events   = e.data || [];
  } catch {
    tasks    = JSON.parse(localStorage.getItem('up_tasks')    || '[]');
    subjects = JSON.parse(localStorage.getItem('up_subjects') || '[]');
    events   = JSON.parse(localStorage.getItem('up_events')   || '[]');
  }

  renderAll();
}

function renderAll() {
  renderHome(); renderTasks(); renderSubjects(); renderProfile();
}

// ─── NAVIGATION ───
function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  const nb = document.getElementById('nav-'+screen);
  if (nb) nb.classList.add('active');
  if (screen==='calendar') renderCalendar();
}

// ─── HOME ───
function renderHome() {
  const now = new Date();
  const DAYS  = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MONTHS= ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('home-greeting').textContent = `Olá, ${profile.name} 👋`;
  document.getElementById('home-date').textContent     = `${DAYS[now.getDay()]}, ${now.getDate()} de ${MONTHS[now.getMonth()]}`;

  const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const today = DOW[now.getDay()];
  const nxt = subjects.find(s => s.schedule && s.schedule.includes(today));
  document.getElementById('home-next-class').textContent = nxt
    ? `${nxt.name} - ${nxt.schedule}`
    : 'Nenhuma aula hoje';

  const pend = tasks.filter(t=>!t.completed).length;
  document.getElementById('home-pending-count').textContent =
    pend === 0 ? 'Nenhuma tarefa pendente 🎉' : `${pend} tarefa${pend>1?'s':''} para hoje`;
}

// ─── TASKS ───
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-pending').classList.toggle('active', tab==='pending');
  document.getElementById('tab-done').classList.toggle('active', tab==='done');
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('task-list');
  const items = tasks.filter(t => currentTab==='pending' ? !t.completed : t.completed);
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">${currentTab==='pending'?'🎉':'📋'}</div><div>${currentTab==='pending'?'Nenhuma tarefa pendente!':'Nenhuma tarefa concluída.'}</div></div>`;
    return;
  }
  list.innerHTML = items.map(t => `
    <div class="task-item">
      <div class="task-checkbox ${t.completed?'checked':''}" onclick="toggleTask('${gid(t)}',${t.completed})">✓</div>
      <div class="task-text ${t.completed?'done':''}">${esc(t.title)}</div>
      <button class="task-del" onclick="deleteTask('${gid(t)}')">🗑</button>
    </div>`).join('');
}

async function quickAdd() {
  const inp = document.getElementById('quick-input');
  const title = inp.value.trim(); if (!title) return;
  inp.value = '';
  await doAddTask({ title, dueDate: new Date().toISOString(), difficulty:1 });
}

async function saveTask() {
  const title = document.getElementById('t-title').value.trim();
  if (!title) return toast('⚠️ Título obrigatório');
  await doAddTask({
    title,
    dueDate: document.getElementById('t-due').value || new Date().toISOString(),
    subject: document.getElementById('t-subject').value || null,
    difficulty: 1,
  });
  closeModal('task');
  document.getElementById('t-title').value = '';
}

async function doAddTask(body) {
  try {
    const r = await fetch(API+'/tasks', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (d.success) tasks.unshift(d.data);
    else throw 0;
  } catch {
    tasks.unshift({ _id: Date.now().toString(), ...body, completed:false });
    save();
  }
  renderTasks(); renderHome();
  toast('✅ Tarefa adicionada!');
}

async function toggleTask(id, done) {
  if (done) return;
  try {
    const r = await fetch(`${API}/tasks/${id}/complete`, { method:'PUT' });
    const d = await r.json();
    if (d.success) { const i=tasks.findIndex(t=>gid(t)===id); if(i>-1) tasks[i]=d.data; }
    else throw 0;
  } catch {
    const i=tasks.findIndex(t=>gid(t)===id); if(i>-1) tasks[i].completed=true; save();
  }
  renderTasks(); renderHome(); toast('✅ Tarefa concluída!');
}

async function deleteTask(id) {
  try { await fetch(`${API}/tasks/${id}`, { method:'DELETE' }); } catch {}
  tasks = tasks.filter(t=>gid(t)!==id); save();
  renderTasks(); renderHome(); toast('🗑 Tarefa removida');
}

// ─── SUBJECTS ───
function renderSubjects() {
  const el = document.getElementById('subject-list');
  if (!subjects.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📚</div><div>Nenhuma matéria ainda.</div></div>';
    return;
  }
  el.innerHTML = subjects.map(s => `
    <div class="subject-card" style="background:${s.color}28;border:1px solid ${s.color}45">
      <div class="subject-dot" style="background:${s.color}"></div>
      <div class="subject-info">
        <div class="subject-name">${esc(s.name)}</div>
        <div class="subject-meta">${s.teacher?`Prof. ${esc(s.teacher)}`:''}${s.teacher&&s.schedule?' - ':''}${esc(s.schedule||'')}</div>
      </div>
      <button class="subject-del" onclick="deleteSubject('${gid(s)}')">🗑</button>
    </div>`).join('');
}

async function saveSubject() {
  const name = document.getElementById('s-name').value.trim();
  if (!name) return toast('⚠️ Nome obrigatório');
  const body = { name, teacher: document.getElementById('s-teacher').value, schedule: document.getElementById('s-schedule').value, color: selColor };
  try {
    const r = await fetch(API+'/subjects', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (d.success) subjects.push(d.data); else throw 0;
  } catch { subjects.push({ _id:Date.now().toString(), ...body }); save(); }
  closeModal('subject');
  ['s-name','s-teacher','s-schedule'].forEach(id => document.getElementById(id).value='');
  renderSubjects(); renderHome(); toast('📚 Matéria adicionada!');
}

async function deleteSubject(id) {
  try { await fetch(`${API}/subjects/${id}`, { method:'DELETE' }); } catch {}
  subjects = subjects.filter(s=>gid(s)!==id); save();
  renderSubjects(); toast('🗑 Matéria removida');
}

// ─── CALENDAR ───
function renderCalendar() {
  const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('cal-month-label').textContent = `${MONTHS[calMonth]} ${calYear}`;

  const first = new Date(calYear, calMonth, 1).getDay();
  const total = new Date(calYear, calMonth+1, 0).getDate();
  const prevTotal = new Date(calYear, calMonth, 0).getDate();
  const now = new Date();
  const isCurMonth = now.getFullYear()===calYear && now.getMonth()===calMonth;

  const eventDays = new Set(events.map(e=>{
    const d=new Date(e.date);
    return d.getFullYear()===calYear&&d.getMonth()===calMonth ? d.getDate() : null;
  }).filter(Boolean));

  const DOWS = ['Dom','Seg','Ter','Qui','Qui','Sea','Sáb'];
  let html = DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  for (let i=0;i<first;i++) html += `<div class="cal-day other-month">${prevTotal-first+i+1}</div>`;

  for (let d=1;d<=total;d++) {
    const isToday = isCurMonth && d===now.getDate();
    const isSel   = d===selDay && !isToday;
    const hasEv   = eventDays.has(d);
    html += `<div class="cal-day${isToday?' today':''}${isSel?' sel':''}${hasEv?' has-event':''}" onclick="selectDay(${d})">${d}</div>`;
  }

  const rem = 42 - first - total;
  for (let i=1;i<=rem;i++) html += `<div class="cal-day other-month">${i}</div>`;

  document.getElementById('cal-grid').innerHTML = html;
  renderDayEvents();
}

function selectDay(d) { selDay=d; renderCalendar(); }

function changeMonth(dir) {
  calMonth+=dir;
  if (calMonth<0){calMonth=11;calYear--;} if (calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

function renderDayEvents() {
  const dayEvs = events.filter(e=>{
    const d=new Date(e.date);
    return d.getFullYear()===calYear&&d.getMonth()===calMonth&&d.getDate()===selDay;
  });
  document.getElementById('events-label').textContent = `Eventos do Dia (${selDay})`;
  const el = document.getElementById('events-day-list');
  if (!dayEvs.length) { el.innerHTML='<div class="empty" style="padding:16px 0"><div>Nenhum evento neste dia.</div></div>'; return; }
  el.innerHTML = dayEvs.map(e=>`
    <div class="event-item">
      <div class="event-icon" style="background:${TYPE_BG[e.type]||'#1e2538'}">${TYPE_ICONS[e.type]||'📌'}</div>
      <div class="event-info">
        <div class="event-name">${esc(e.title)}</div>
        <div class="event-sub">${e.type}</div>
      </div>
      <div class="event-hour">${e.time||'--:--'}</div>
      <button class="event-del" onclick="deleteEvent('${gid(e)}')">🗑</button>
    </div>`).join('');
}

async function saveEvent() {
  const title = document.getElementById('e-title').value.trim();
  const date  = document.getElementById('e-date').value;
  if (!title||!date) return toast('⚠️ Título e data obrigatórios');
  const body = { title, date, time: document.getElementById('e-time').value, type: document.getElementById('e-type').value };
  try {
    const r=await fetch(API+'/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json(); if(d.success) events.push(d.data); else throw 0;
  } catch { events.push({_id:Date.now().toString(),...body}); save(); }
  closeModal('event');
  document.getElementById('e-title').value='';
  renderCalendar(); toast('📅 Evento adicionado!');
}

async function deleteEvent(id) {
  try { await fetch(`${API}/events/${id}`,{method:'DELETE'}); } catch {}
  events=events.filter(e=>gid(e)!==id); save();
  renderDayEvents(); toast('🗑 Evento removido');
}

// ─── PROFILE ───
function renderProfile() {
  document.getElementById('profile-name-display').textContent    = profile.name    || 'Estudante';
  document.getElementById('profile-curso-display').textContent   = profile.curso   || '—';
  document.getElementById('profile-periodo-display').textContent = profile.periodo || '—';
}

function openProfileModal() {
  document.getElementById('p-name').value    = profile.name    || '';
  document.getElementById('p-curso').value   = profile.curso   || '';
  document.getElementById('p-periodo').value = profile.periodo || '';
  document.getElementById('modal-profile').classList.add('open');
}

function saveProfile() {
  profile.name    = document.getElementById('p-name').value.trim()    || 'Estudante';
  profile.curso   = document.getElementById('p-curso').value.trim();
  profile.periodo = document.getElementById('p-periodo').value.trim();
  localStorage.setItem('up_profile', JSON.stringify(profile));
  closeModal('profile');
  renderProfile(); renderHome(); toast('✅ Perfil salvo!');
}

function resetData() {
  if (!confirm('Resetar todos os dados?')) return;
  tasks=[]; subjects=[]; events=[];
  localStorage.removeItem('up_tasks');
  localStorage.removeItem('up_subjects');
  localStorage.removeItem('up_events');
  renderAll(); renderCalendar(); toast('🔄 Dados resetados');
}

// ─── MODALS ───
function openTaskModal() {
  document.getElementById('t-subject').innerHTML =
    '<option value="">Nenhuma</option>' + subjects.map(s=>`<option value="${gid(s)}">${esc(s.name)}</option>`).join('');
  document.getElementById('modal-task').classList.add('open');
}

function openSubjectModal() {
  selColor = '#4a7cf7';
  document.getElementById('color-row').innerHTML = COLORS.map(c=>`
    <div class="color-opt${c===selColor?' sel':''}" style="background:${c}" onclick="pickColor('${c}',this)"></div>`).join('');
  document.getElementById('modal-subject').classList.add('open');
}

function openEventModal() {
  document.getElementById('e-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('modal-event').classList.add('open');
}

function closeModal(type) {
  document.getElementById('modal-'+type).classList.remove('open');
}

function pickColor(c, el) {
  selColor=c;
  document.querySelectorAll('.color-opt').forEach(d=>d.classList.remove('sel'));
  el.classList.add('sel');
}

document.querySelectorAll('.modal-overlay').forEach(o=>
  o.addEventListener('click', e=>{ if(e.target===o) closeModal(o.id.replace('modal-','')); })
);

// ─── UTILS ───
function gid(obj) { return String(obj._id||obj.id||''); }
function esc(s)   { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function save()   { localStorage.setItem('up_tasks',JSON.stringify(tasks)); localStorage.setItem('up_subjects',JSON.stringify(subjects)); localStorage.setItem('up_events',JSON.stringify(events)); }

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

init();
</script>
</body>
</html>
